[project]
name = "space-shooters"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cf-agents>=0.1.3",
    "crosswind-workers",
    "numpy==2.4.6",
]

[dependency-groups]
dev = ["wynd>=0.4.1"]

[tool.wynd]
# numpy's C extension imports this by name, so the tree shaker can't see it.
keep = ["numpy._core._exceptions"]
